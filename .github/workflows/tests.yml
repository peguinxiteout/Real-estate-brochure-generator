name: tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - master

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project with its dev extra
        run: python -m pip install -e ".[dev]"

      - name: Unit tests (integration tests need Ghostscript and Pango, llm tests need a network and an API key; both are excluded)
        run: python -m pytest -m "not integration and not llm"
