[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brochure"
version = "0.0.0"
description = "Print-ready 8-page A4 real estate brochure generator (Phase 0)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "weasyprint>=62",
    "qrcode[pil]>=7.4",
    "Pillow>=10",
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "openai==3.42.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pypdf>=5",
]

[project.scripts]
brochure = "brochure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brochure = ["agents/prompts/*.md", "agents/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -ra prints a summary line (with the reason) for every skipped test, so a skip is never silent.
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than a second or two; deselect with -m 'not slow'",
    "integration: needs a real external tool (WeasyPrint, Ghostscript); skips with a reason when it is missing",
    "llm: calls a real LLM (network, API key); never run in unit tests, deselect with -m 'not llm'",
]
