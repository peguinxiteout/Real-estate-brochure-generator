[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brochure"
version = "0.0.0"
description = "Print-ready 8-page A4 real estate brochure generator (Phase 0)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "weasyprint>=62",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pypdf>=5",
]

[project.scripts]
brochure = "brochure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra prints a summary line (with the reason) for every skipped test, so a skip is never silent.
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than a second or two; deselect with -m 'not slow'",
    "integration: needs a real external tool (WeasyPrint, Ghostscript); skips with a reason when it is missing",
]
